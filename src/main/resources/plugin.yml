name: AstExample
version: '${project.version}'
main: br.net.silvioluizsilva.astexample.AstExample
description: Exemplo completo de plugin consumidor do AstatineCore.
author: "Sílvio Luiz da Silva"
website: https://github.com/silvioluizsilva
api-version: '26.2'
folia-supported: false

# Plugin Bukkit: o Paper carrega o AstatineCore antes deste plugin.
depend: [AstatineCore]

permissions:
  astexample.command.hello:
    description: Permite executar o comando de exemplo.
    default: true
